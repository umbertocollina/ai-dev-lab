# API Specification Template

openapi: 3.0.0
info:
  title: <API_NAME>
  version: 1.0.0
  description: <DESCRIPTION>
  contact:
    name: <CONTACT_NAME>
    email: <CONTACT_EMAIL>

servers:
  - url: https://api.example.com/v1
    description: Production server
  - url: https://staging-api.example.com/v1
    description: Staging server

paths:
  /<resource>:
    get:
      summary: Get all <resources>
      tags:
        - <Resource>
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/<Resource>'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    
    post:
      summary: Create a new <resource>
      tags:
        - <Resource>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/<Resource>Create'
      responses:
        '201':
          description: Resource created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /<resource>/{id}:
    get:
      summary: Get <resource> by ID
      tags:
        - <Resource>
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Resource found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>'
        '404':
          description: Resource not found
    
    put:
      summary: Update <resource>
      tags:
        - <Resource>
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/<Resource>Update'
      responses:
        '200':
          description: Resource updated
        '404':
          description: Resource not found
    
    delete:
      summary: Delete <resource>
      tags:
        - <Resource>
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Resource deleted
        '404':
          description: Resource not found

components:
  schemas:
    <Resource>:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
    
    <Resource>Create:
      type: object
      properties:
        # Add creation fields
      required:
        # Add required fields
    
    <Resource>Update:
      type: object
      properties:
        # Add update fields
    
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
      required:
        - error
        - message

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
